name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Build
    # Run tests on Linux, macOS, and Windows to ensure cross-platform compatibility
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: [ '1.25', '1.26' ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true # Automatically caches dependencies for faster subsequent runs

    - name: Install dependencies
      run: go mod download

    - name: Run Linter (Linux only)
      if: matrix.os == 'ubuntu-latest'
      uses: golangci/golangci-lint-action@v6
      with:
        version: v7

    - name: Run Tests
      # If you write tests later, this ensures they pass across all platforms
      run: go test -v ./...

    - name: Verify Build
      # Verifies that gomon compiles cleanly on all target operating systems
      run: go build -v .
